<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#778197;--nav:#8f0f1b;--red:#c8102e;--dark:#272d3e;--green:#4f9d30;--amber:#d99016;--blue:#3f6ccf}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:var(--nav);color:#fff;padding:18px 14px;transition:.25s;z-index:30}.sidebar.closed{width:72px}.brand{display:flex;align-items:center;gap:11px;height:48px;padding:0 7px}.logo{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 42px}.logo img{width:100%;height:100%;object-fit:contain}.brand-txt{white-space:nowrap;overflow:hidden}.brand-txt b{font-size:13px}.brand-txt small{display:block;color:#dac0c4;font-size:10px}.hamb{position:absolute;right:13px;top:74px;border:0;background:#ffffff20;color:#fff;border-radius:7px;width:36px;height:34px;cursor:pointer}.nav{margin-top:56px;display:flex;flex-direction:column;gap:5px}.nav-btn{width:100%;border:0;background:transparent;color:#e6cfd3;padding:11px 12px;border-radius:8px;text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:#ffffff20;color:#fff}.ico{font-size:17px;min-width:22px;text-align:center}.label{white-space:nowrap;overflow:hidden}.submenu{display:none;margin:2px 0 5px 34px;padding-left:10px;border-left:1px solid #ffffff4c}.submenu.open{display:flex;flex-direction:column;gap:3px}.submenu button,.submenu a{border:0;background:transparent;color:#e2c6ca;text-decoration:none;font-size:11px;padding:8px 10px;border-radius:7px;text-align:left;cursor:pointer}.submenu button:hover,.submenu button.active,.submenu a:hover{background:#ffffff20;color:#fff}.sidebar.closed .label,.sidebar.closed .brand-txt,.sidebar.closed .submenu{display:none!important}.main{margin-left:238px;padding:24px 28px;transition:.25s}.main.wide{margin-left:72px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:10px;color:#8a91a2;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:25px;margin:5px 0}.sub{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.upload{border:1px solid #dfe2e8;background:#fff;color:#4c5468;border-radius:8px;padding:9px 12px;font-size:11px;font-weight:700;cursor:pointer}.btn.primary,.upload.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.danger{color:#b42318}.upload input{display:none}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}.tab{border:0;background:transparent;padding:10px 1px;font-size:12px;color:#798195;white-space:nowrap;cursor:pointer}.tab.active{color:#242a3d;font-weight:800;border-bottom:3px solid var(--red)}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}.filters select,.filters input{min-width:170px;padding:9px 11px;border:1px solid #dfe2e8;border-radius:8px;background:#fff;color:#4e566b;font-size:11px}.ticker-wrap{overflow:hidden;margin-bottom:16px}.ticker{display:flex;gap:12px;width:max-content;animation:scroll 34s linear infinite}.ticker:hover{animation-play-state:paused}@keyframes scroll{to{transform:translateX(-50%)}}.kpi{width:205px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 15px}.kpi small{display:block;color:#80889a;font-size:9px;text-transform:uppercase;font-weight:800}.kpi strong{display:block;font-size:22px;margin:9px 0 4px}.kpi span{font-size:10px;color:#959cab}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 1px 3px #1e243408}.card h2{font-size:13px;margin:0 0 4px}.desc{font-size:10px;color:#9097a7;margin-bottom:15px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.stack{display:grid;gap:14px}.tablewrap{overflow:auto;max-height:65vh;border:1px solid #edf0f3;border-radius:9px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:10px}th{position:sticky;top:0;z-index:3;background:#fafbfc;color:#606a80;text-align:left;padding:9px;white-space:nowrap;border-bottom:1px solid #e7eaf0}td{padding:9px;border-bottom:1px solid #edf0f3;color:#4f576b;white-space:nowrap}.group-head th{background:#eef1f5;text-align:center;text-transform:uppercase;font-size:9px;letter-spacing:.06em}.group-head th:first-child{text-align:left}.nested-head th{top:29px}.num{text-align:right}.badge{padding:3px 7px;border-radius:9px;font-size:9px;font-weight:700}.good{background:#eef8e8;color:#5c9c2d}.bad{background:#fff0f1;color:#d75c66}.warn{background:#fff7e5;color:#a96f0c}.muted{color:#9aa1af}.add-row{width:100%;margin-top:9px;border:1px dashed #cfd5df;background:#fafbfc;color:#667085;border-radius:8px;padding:10px;cursor:pointer;font-size:11px;font-weight:700}.add-row:hover{border-color:var(--red);color:var(--red)}.empty{padding:50px 20px;text-align:center;color:#8f96a7}.empty b{display:block;color:#424a5f;font-size:16px;margin-bottom:8px}.source{margin-top:12px;text-align:right;font-size:9px;color:#9ba2b1}.statusbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:10px;color:#7a8293}.subtabs{display:flex;gap:6px;margin-bottom:12px}.subtabs button{border:1px solid #dfe2e8;background:#fff;color:#697286;border-radius:8px;padding:8px 11px;font-size:10px;font-weight:700;cursor:pointer}.subtabs button.active{background:var(--dark);color:#fff}.cell-input,.cell-select{min-width:130px;border:1px solid #dfe2e8;border-radius:6px;padding:6px 7px;background:#fff;font-size:10px}.cell-input{min-width:160px}.widecell{min-width:220px}.source-pill{font-size:9px;background:#eef1f5;padding:4px 7px;border-radius:999px}.barrow{display:grid;grid-template-columns:150px 1fr 65px;gap:8px;align-items:center;margin:9px 0;font-size:10px}.track{height:13px;background:#eef1f5;border-radius:4px;overflow:hidden}.bar{height:100%;background:var(--red)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.notice{padding:11px 13px;border-left:3px solid var(--blue);background:#eef4ff;color:#52627f;font-size:10px;margin-bottom:12px;border-radius:5px}.hidden{display:none!important}@media(max-width:1050px){.grid{grid-template-columns:1fr}.sidebar{width:72px}.sidebar .label,.sidebar .brand-txt{display:none}.main{margin-left:72px}}@media(max-width:620px){.main{padding:16px;margin-left:0}.sidebar{transform:translateX(-100%)}.sidebar.mobile{transform:translateX(0);width:238px}.topbar{display:block}.actions{margin-top:12px}}
</style></head><body><aside id="side" class="sidebar"><div class="brand"><div class="logo"><img src="acc-hub-logo.png" alt="ACC Hub"></div><div class="brand-txt"><b>ACC Hub</b><small>Supplier Intelligence</small></div></div><button id="hamb" class="hamb" aria-label="Recolher menu">☰</button><nav class="nav">

<button id="adminBtn" class="nav-btn" data-page="administrativo"><span class="ico">⚙</span><span class="label">Administrativo</span></button><div id="adminSubmenu" class="submenu"><a href="https://accdevhsa.github.io/Dashboard-de-Contratos-ACC/" target="_blank" rel="noopener">▣ Contratos</a></div>
<button id="suppliersBtn" class="nav-btn" data-page="fornecedores"><span class="ico">◆</span><span class="label">Fornecedores</span></button><div id="supplierSubmenu" class="submenu"><button data-supplier-tab="visao">Visão Geral</button><button data-supplier-tab="financeiro">Avaliação Financeira</button><button data-supplier-tab="entregas">Entregas</button><button data-supplier-tab="cadastro">Cadastro</button></div>
</nav></aside><main id="main" class="main"><div class="topbar"><div><div class="eyebrow">Desenvolvimento de Acessórios</div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div id="actions" class="actions"></div></div><div id="tabs" class="tabs"></div><div id="filters" class="filters"></div><div id="tickerWrap" class="ticker-wrap"><div id="ticker" class="ticker"></div></div><section id="content"></section><div id="source" class="source"></div></main>
<script>
const STORE_KEY='acc_hub_modular_v1';const EXACT={financeiro:['Qtd','Cód Fornecedor','Fornecedor','Fonte','Patrimônio Líquido Negativo','FGTS','Rec. Federal','Serasa Qtd. Apontamentos','Data Avaliação','Balanço avaliado','Pontuação','Status','Acompanhamento'],entregaFornecedor:['Cód Fornecedor','Fornecedor','Descrição','Média de LT Acordado','Média de LT Real','Média de LT Dif','Soma de Qtd Solicit','Soma de Qtd Entreg LT','Soma de Qtd Dif'],entregaMaterial:['Cód Fornecedor','Fornecedor','Descrição Fornecedor','Material','Descrição','Soma de LT Acordado','Soma de LT Real','Soma de LT Dif','Soma de Qtd Solicit','Soma de Qtd Entreg LT','Soma de Qtd Dif'],cadastro:['Cód Fornecedor','CÓDIGO SAP','RAZÃO SOCIAL','CNPJ','CÓDIGO JDE','ENDEREÇO','CIDADE','CONTATO','E-MAIL CONTATO','MILK RUN','PRODUTOS','STATUS']};
let state=loadState(),page='dashboard',supplierTab='visao',deliveryMenu='fornecedor';function loadState(){try{return Object.assign({financeiro:[],entregaFornecedor:[],entregaMaterial:[],cadastro:[],manual:[]},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}catch{return{financeiro:[],entregaFornecedor:[],entregaMaterial:[],cadastro:[],manual:[]}}}function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');const num=v=>{if(typeof v==='number')return v;let s=String(v??'').trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return Number(s)||0};const fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(num(n));function idOf(r){return String(r['Cód Fornecedor']||r['CÓDIGO SAP']||r['Cód SAP']||r['Codigo SAP']||r['Cód SAP']||r['Fornecedor']||'').trim()}function uniqueLatest(rows){const m=new Map;rows.forEach(r=>{const id=idOf(r);if(id)m.set(id,r)});return m}function displayValue(v){return v===0?'0':(v||'—')}function badge(v){let n=norm(v),cl=n.includes('aprov')||n.includes('ativo')||n.includes('regular')?'good':n.includes('reprov')||n.includes('inativo')||n.includes('crit')?'bad':'warn';return `<span class="badge ${cl}">${esc(displayValue(v))}</span>`}
const titles={dashboard:['Dashboard de fornecedores','Consolidação dinâmica das bases dos módulos'],compras:['Compras','Performance comercial por fornecedor'],desenvolvimento:['Desenvolvimento','Projetos e marcos por fornecedor'],qualidade:['Qualidade','Garantias e desempenho por fornecedor'],administrativo:['Administrativo','Governança e configurações do HUB'],fornecedores:['Fornecedores','Cadastro mestre e consolidação modular por Cód Fornecedor']};
function setActions(html=''){actions.innerHTML=html}function uploadButton(dataset,label='Carregar planilha'){return `<label class="upload primary">${label}<input type="file" accept=".xlsx,.xls,.csv" data-upload="${dataset}"></label>`}function commonTicker(){let ids=new Set([...state.cadastro,...state.financeiro,...state.entregaFornecedor].map(idOf).filter(Boolean)),fin=state.financeiro.length,ent=state.entregaFornecedor.length,cad=state.cadastro.length,items=[['Fornecedores integrados',ids.size,'Cód Fornecedor únicos'],['Cadastros ativos',state.cadastro.filter(x=>norm(x.STATUS).includes('ativo')).length,`${cad} registros no cadastro`],['Avaliações financeiras',fin,'registros importados'],['Fornecedores com entrega',ent,'resumos carregados'],['Materiais monitorados',state.entregaMaterial.length,'linhas da base'],['Módulos conectados',[cad>0,fin>0,ent>0,state.entregaMaterial.length>0].filter(Boolean).length+'/4','persistência local']];let h=items.map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('');ticker.innerHTML=h+h;tickerWrap.classList.remove('hidden')}
function render(){title.textContent=titles[page][0];subtitle.textContent=titles[page][1];filters.innerHTML='';tabs.innerHTML='';setActions('');commonTicker();if(page==='fornecedores')renderSuppliers();else renderBasePage();bindUploads()}
function renderBasePage(){if(page==='dashboard'){setActions('<button class="btn" id="exportDashboard">Exportar visão</button>');let ov=overviewRows(),total=ov.length,avgScore=ov.length?ov.reduce((s,r)=>s+num(r.score),0)/ov.length:0,avgLT=ov.length?ov.reduce((s,r)=>s+num(r.ltReal),0)/ov.length:0;content.innerHTML=`<div class="notice">O Dashboard agora consome as bases independentes de Fornecedores. O relacionamento é feito exclusivamente pelo campo canônico <b>Cód Fornecedor</b>.</div><div class="grid"><div class="card"><h2>Consolidação modular</h2><div class="desc">Indicadores calculados a partir das subpastas, sem depender de uma base única.</div><table><tbody><tr><td>Fornecedores consolidados</td><td class="num"><b>${total}</b></td></tr><tr><td>Pontuação financeira média</td><td class="num"><b>${fmt(avgScore)}</b></td></tr><tr><td>LT realizado médio</td><td class="num"><b>${fmt(avgLT)} dias</b></td></tr><tr><td>Última atualização</td><td class="num"><b>${new Date().toLocaleString('pt-BR')}</b></td></tr></tbody></table></div><div class="card"><h2>Fontes conectadas</h2><div class="desc">Cada módulo mantém armazenamento e atualização próprios.</div>${sourceHealth()}</div></div>`;document.getElementById('exportDashboard').onclick=()=>exportRows(overviewRows(),'Dashboard_Consolidado.xlsx')}else{content.innerHTML=`<div class="card empty"><b>Módulo ${titles[page][0]} preparado</b>Este módulo permanecerá independente e poderá alimentar o Dashboard por meio do mesmo identificador Cód Fornecedor.</div>`}}
function sourceHealth(){return [['Cadastro',state.cadastro.length],['Avaliação Financeira',state.financeiro.length],['Entregas por fornecedor',state.entregaFornecedor.length],['Entregas por material',state.entregaMaterial.length]].map(x=>`<div class="statusbar"><span>${x[0]}</span><b>${x[1]} registros</b></div>`).join('')}
function renderSuppliers(){const t=[['visao','Visão Geral'],['financeiro','Avaliação Financeira'],['entregas','Entregas'],['cadastro','Cadastro']];tabs.innerHTML=t.map(x=>`<button class="tab ${supplierTab===x[0]?'active':''}" data-supplier-tab="${x[0]}">${x[1]}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{supplierTab=b.dataset.supplierTab;render()});supplierSubmenu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.supplierTab===supplierTab));if(supplierTab==='visao')renderOverview();if(supplierTab==='financeiro')renderDataset('financeiro','Avaliação Financeira');if(supplierTab==='entregas')renderDeliveries();if(supplierTab==='cadastro')renderDataset('cadastro','Cadastro mestre')}
function overviewRows(){const cad=uniqueLatest(state.cadastro),fin=uniqueLatest(state.financeiro),del=uniqueLatest(state.entregaFornecedor),ids=[...new Set([...cad.keys(),...state.manual.map(x=>x.id).filter(Boolean)])];return ids.map(id=>{let c=cad.get(id)||{},f=fin.get(id)||{},d=del.get(id)||{},manual=state.manual.find(x=>x.id===id)||{};return{id,razao:c['RAZÃO SOCIAL']||manual.razao||'',sap:c['CÓDIGO SAP']||id,jde:c['CÓDIGO JDE']||'',statusCad:c.STATUS||'',score:f['Pontuação']||'',statusFin:f.Status||'',ltA:d['Média de LT Acordado']||'',ltReal:d['Média de LT Real']||'',volA:d['Soma de Qtd Solicit']||'',volReal:d['Soma de Qtd Entreg LT']||''}})}
function renderOverview(){setActions(`<button class="btn" id="exportOverview">Exportar visão</button>`);let rows=overviewRows();content.innerHTML=`<div class="notice">A Visão Geral é preenchida automaticamente. <b>Cód SAP</b> é tratado como o <b>Cód Fornecedor</b> canônico e conecta Cadastro, Avaliação Financeira e Entregas.</div><div class="card"><h2>Visão consolidada de fornecedores</h2><div class="desc">Valores únicos da coluna CÓDIGO SAP do Cadastro. Use o botão + para adicionar um fornecedor provisório.</div><div class="tablewrap"><table><thead><tr class="group-head"><th colspan="4">Dados Cadastrais</th><th colspan="2">Avaliação Financeira</th><th colspan="4">Entregas</th></tr><tr class="nested-head"><th>Razão Social</th><th>Cód SAP</th><th>Cód JDE</th><th>Status</th><th>Pontuação</th><th>Status</th><th>LT Acordado</th><th>LT Entregue</th><th>Volume Acordado</th><th>Volume Entregue</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(displayValue(r.razao))}</td><td><b>${esc(r.sap)}</b></td><td>${esc(displayValue(r.jde))}</td><td>${badge(r.statusCad)}</td><td class="num">${esc(displayValue(r.score))}</td><td>${badge(r.statusFin)}</td><td class="num">${esc(displayValue(r.ltA))}</td><td class="num">${esc(displayValue(r.ltReal))}</td><td class="num">${esc(displayValue(r.volA))}</td><td class="num">${esc(displayValue(r.volReal))}</td></tr>`).join('')}</tbody></table></div><button id="addSupplier" class="add-row">＋ Adicionar novo fornecedor</button></div>`;addSupplier.onclick=addManualSupplier;exportOverview.onclick=()=>exportRows(rows,'Fornecedores_Visao_Geral.xlsx')}
function addManualSupplier(){let id=prompt('Informe o Cód Fornecedor / Cód SAP:');if(!id)return;id=id.trim();if(overviewRows().some(x=>x.id===id))return alert('Este Cód Fornecedor já existe.');let razao=prompt('Informe a Razão Social:')||'';state.manual.push({id,razao});save();render()}
function renderDataset(key,name){let cols=EXACT[key],rows=state[key];setActions(`${uploadButton(key,'Atualizar por Excel')}<button class="btn" data-template="${key}">Baixar modelo</button><button class="btn danger" data-clear="${key}">Limpar base</button>`);content.innerHTML=`<div class="statusbar"><span><b>${name}</b> · atualização independente</span><span class="source-pill">${rows.length} registros salvos neste navegador</span></div><div class="card"><div class="tablewrap"><table><thead><tr>${cols.map((c,i)=>`<th>${String.fromCharCode(65+i)} · ${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(displayValue(r[c]))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">Carregue uma planilha com as colunas exibidas no cabeçalho.</td></tr>`}</tbody></table></div></div>`;bindDatasetActions()}
function renderDeliveries(){let key=deliveryMenu==='fornecedor'?'entregaFornecedor':'entregaMaterial',cols=EXACT[key],rows=state[key];setActions(`${uploadButton(key,'Atualizar menu atual')}<button class="btn" data-template="${key}">Baixar modelo</button><button class="btn danger" data-clear="${key}">Limpar base</button>`);content.innerHTML=`<div class="subtabs"><button class="${deliveryMenu==='fornecedor'?'active':''}" data-delivery="fornecedor">Resumo por Fornecedor</button><button class="${deliveryMenu==='material'?'active':''}" data-delivery="material">Resumo por Material</button></div><div class="statusbar"><span>Base independente: <b>${deliveryMenu==='fornecedor'?'Resumo por Fornecedor':'Resumo por Material'}</b></span><span class="source-pill">${rows.length} registros</span></div><div class="card"><div class="tablewrap"><table><thead><tr>${cols.map((c,i)=>`<th>${String.fromCharCode(65+i)} · ${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(displayValue(r[c]))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">Carregue a planilha específica deste menu.</td></tr>`}</tbody></table></div></div>`;document.querySelectorAll('[data-delivery]').forEach(b=>b.onclick=()=>{deliveryMenu=b.dataset.delivery;render()});bindDatasetActions()}
function bindDatasetActions(){document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>downloadTemplate(b.dataset.template));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{if(confirm('Limpar somente esta base?')){state[b.dataset.clear]=[];save();render()}})}
function bindUploads(){document.querySelectorAll('input[data-upload]').forEach(inp=>inp.onchange=e=>importFile(e.target.files[0],inp.dataset.upload))}
async function importFile(file,key){if(!file)return;try{let wb=file.name.toLowerCase().endsWith('.csv')?XLSX.read(await file.text(),{type:'string'}):XLSX.read(await file.arrayBuffer(),{type:'array'}),raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false}),cols=EXACT[key],mapped=raw.map(row=>{let out={};cols.forEach(c=>{let found=Object.keys(row).find(k=>norm(k)===norm(c));out[c]=found?row[found]:''});out['Cód Fornecedor']=idOf(out)||idOf(row);return out}).filter(r=>Object.values(r).some(v=>String(v).trim()));let missing=cols.filter(c=>!Object.keys(raw[0]||{}).some(k=>norm(k)===norm(c))).filter(c=>c!=='Cód Fornecedor');if(missing.length&&!confirm('Colunas não encontradas: '+missing.join(', ')+'. Continuar mesmo assim?'))return;state[key]=mapped;save();render();alert(`${mapped.length} registros importados em ${key}.`)}catch(err){alert('Não foi possível ler a planilha: '+err.message)}}
function downloadTemplate(key){let ws=XLSX.utils.aoa_to_sheet([EXACT[key]]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Modelo');XLSX.writeFile(wb,`Modelo_${key}.xlsx`)}function exportRows(rows,name){if(!rows.length)return alert('Não há dados para exportar.');let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Dados');XLSX.writeFile(wb,name)}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;adminSubmenu.classList.toggle('open',page==='administrativo');supplierSubmenu.classList.toggle('open',page==='fornecedores');if(page==='fornecedores'&&side.classList.contains('closed')){side.classList.remove('closed');main.classList.remove('wide')}render()});supplierSubmenu.querySelectorAll('button').forEach(b=>b.onclick=()=>{page='fornecedores';supplierTab=b.dataset.supplierTab;supplierSubmenu.classList.add('open');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.id==='suppliersBtn'));render()});hamb.onclick=()=>{side.classList.toggle('closed');main.classList.toggle('wide')};render();
