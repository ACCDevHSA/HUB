<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACC Hub | Supplier Intelligence</title>
<link rel="icon" type="image/png" href="acc-hub-favicon.png">
<link rel="apple-touch-icon" href="acc-hub-logo.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e7e9ee;--text:#22283a;--muted:#7c8495;--green:#72b936;--red:#d71920;--amber:#e5a52e;--indigo:#c8102e;--nav:#8f0f1b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:var(--nav);color:#fff;padding:18px 14px;transition:.25s;z-index:20}.sidebar.closed{width:72px}.brand{display:flex;align-items:center;gap:11px;height:48px;padding:0 7px;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 42px}.logo img{width:100%;height:100%;object-fit:contain;display:block}.brand-txt{white-space:nowrap;overflow:hidden}.brand-txt b{display:block;font-size:13px}.brand-txt small{color:#aeb5c8;font-size:10px}.hamb{position:absolute;right:13px;top:74px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;width:36px;height:34px;cursor:pointer}.nav{margin-top:55px;display:flex;flex-direction:column;gap:6px}.nav button{width:100%;border:0;background:transparent;color:#bfc5d5;padding:11px 12px;border-radius:8px;text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.15);color:#fff}.submenu{display:none;margin:2px 0 4px 34px;padding-left:10px;border-left:1px solid rgba(255,255,255,.3)}.submenu.open{display:flex;flex-direction:column;gap:4px}.submenu a{color:#bfc5d5;text-decoration:none;font-size:11px;padding:9px 10px;border-radius:7px;white-space:nowrap;overflow:hidden}.submenu a:hover{background:rgba(255,255,255,.15);color:#fff}.sidebar.closed .submenu{display:none!important}.ico{font-size:17px;min-width:22px;text-align:center}.label{white-space:nowrap;overflow:hidden}.sidebar.closed .label,.sidebar.closed .brand-txt{display:none}.main{margin-left:238px;padding:24px 28px;transition:.25s}.main.wide{margin-left:72px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:10px;color:#8a91a2;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:25px;margin:5px 0}.sub{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.upload{border:1px solid #dfe2e8;background:#fff;color:#4c5468;border-radius:8px;padding:9px 12px;font-size:11px;font-weight:700;cursor:pointer}.upload.primary{background:#272d3e;color:#fff;border-color:#272d3e}.upload input{display:none}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}.tab{padding:10px 1px;font-size:12px;color:#798195;white-space:nowrap}.tab.active{color:#242a3d;font-weight:750;border-bottom:3px solid #242a3d}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}.filters select,.filters input{min-width:170px;padding:9px 11px;border:1px solid #dfe2e8;border-radius:8px;background:#fff;color:#4e566b;font-size:11px}.ticker-wrap{overflow:hidden;margin-bottom:16px}.ticker{display:flex;gap:12px;width:max-content;animation:scroll 34s linear infinite}.ticker:hover{animation-play-state:paused}@keyframes scroll{to{transform:translateX(-50%)}}.kpi{width:205px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 15px;box-shadow:0 1px 2px rgba(30,36,52,.04)}.kpi small{display:block;color:#80889a;font-size:9px;text-transform:uppercase;font-weight:800}.kpi strong{display:block;font-size:22px;margin:9px 0 4px}.kpi span{font-size:10px;color:#959cab}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.stack{display:grid;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;box-shadow:0 1px 3px rgba(30,36,52,.04)}.card h2{font-size:13px;margin:0 0 4px}.card .desc{font-size:10px;color:#9097a7;margin-bottom:15px}.chart{display:flex;flex-direction:column;gap:10px}.barrow{display:grid;grid-template-columns:125px 1fr 62px;gap:9px;align-items:center;font-size:10px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#596176}.track{height:15px;background:#f0f2f6;border-radius:3px;overflow:hidden;position:relative}.bar{height:100%;border-radius:3px}.bar.lt{background:#c8102e}.bar.vol{background:#73b93b}.val{text-align:right;font-weight:700}.funnel{display:flex;flex-direction:column;align-items:center;gap:4px}.funnel-row{height:24px;border-radius:4px;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;min-width:34%;padding:0 8px}.podium{display:flex;align-items:flex-end;justify-content:center;height:205px;gap:8px}.pod{width:28%;border-radius:9px 9px 0 0;color:#fff;text-align:center;padding:12px 5px;font-size:10px}.pod b{display:block;font-size:20px;margin-bottom:5px}.p1{height:175px;background:#c8102e}.p2{height:135px;background:#737f99}.p3{height:105px;background:#b54a55}.tablewrap{overflow:auto;max-height:320px}table{width:100%;border-collapse:collapse;font-size:10px}th{position:sticky;top:0;background:#fafbfc;color:#737b8f;text-align:left;padding:9px;white-space:nowrap}td{padding:9px;border-top:1px solid #edf0f3;color:#4f576b}.num{text-align:right}.badge{padding:3px 7px;border-radius:9px;font-size:9px;font-weight:700}.bad{background:#fff0f1;color:#d75c66}.good{background:#eef8e8;color:#5c9c2d}.empty{padding:55px 20px;text-align:center;color:#8f96a7}.empty b{display:block;color:#424a5f;font-size:16px;margin-bottom:8px}.source{margin-top:12px;text-align:right;font-size:9px;color:#9ba2b1}@media(max-width:1050px){.grid{grid-template-columns:1fr}.sidebar{width:72px}.sidebar .label,.sidebar .brand-txt{display:none}.main{margin-left:72px}}@media(max-width:620px){.main{padding:16px;margin-left:0}.sidebar{transform:translateX(-100%)}.sidebar.mobile{transform:translateX(0);width:238px}.mobilebtn{display:block!important}.topbar{display:block}.actions{margin-top:12px}.barrow{grid-template-columns:95px 1fr 52px}}
</style></head><body><div class="shell"><aside id="side" class="sidebar"><div class="brand"><div class="logo"><img src="acc-hub-logo.png" alt="ACC Hub"></div><div class="brand-txt"><b>ACC Hub</b><small>Supplier Intelligence</small></div></div><button id="hamb" class="hamb">☰</button><nav class="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span><span class="label">Dashboard</span></button><button data-page="compras"><span class="ico">◫</span><span class="label">Compras</span></button><button data-page="desenvolvimento"><span class="ico">◇</span><span class="label">Desenvolvimento</span></button><button data-page="qualidade"><span class="ico">✓</span><span class="label">Qualidade</span></button><button id="adminBtn" data-page="administrativo"><span class="ico">⚙</span><span class="label">Administrativo</span></button><div id="adminSubmenu" class="submenu"><a href="https://accdevhsa.github.io/Dashboard-de-Contratos-ACC/" target="_blank" rel="noopener noreferrer">▣ Contratos</a></div></nav></aside><main id="main" class="main"><div class="topbar"><div><div class="eyebrow">Desenvolvimento de Acessórios</div><h1 id="title">Dashboard de fornecedores</h1><div class="sub" id="subtitle">Visão consolidada de compras, desenvolvimento e qualidade</div></div><div class="actions"><label class="upload primary">Carregar base<input id="file" type="file" accept=".xlsx,.xls,.csv"></label><button class="btn" onclick="exportData()">Exportar visão</button></div></div><div id="tabs" class="tabs"></div><div class="filters"><select id="supplier"></select><select id="project"></select><select id="period"><option>Últimos 12 meses</option><option>Últimos 6 meses</option><option>Últimos 3 meses</option></select><input id="search" placeholder="Buscar material ou fornecedor"></div><div class="ticker-wrap"><div id="ticker" class="ticker"></div></div><section id="content"></section><div id="source" class="source"></div></main></div>
<script>let DATA=[];let page='dashboard';const titles={dashboard:['Dashboard de fornecedores','Visão consolidada de compras, desenvolvimento e qualidade'],compras:['Compras','Performance comercial e atendimento de volume por fornecedor'],desenvolvimento:['Desenvolvimento','Acompanhamento de projetos, materiais e marcos por fornecedor'],qualidade:['Qualidade','Indicadores de garantias, defeitos e desempenho por fornecedor'],administrativo:['Administrativo','Governança, cadastros e configurações do HUB']};const tabMap={dashboard:['Visão geral','Lead time','Volume','Ranking','Garantias'],compras:['Resumo','Lead time','Volume','Cotações','Fornecedores'],desenvolvimento:['Resumo','Projetos','Materiais','Cronograma','Pendências'],qualidade:['Resumo','Garantias','PPM','Não conformidades','Auditorias'],administrativo:['Configurações','Bases de dados','Usuários','Regras de cálculo']};
const fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n);const pct=n=>fmt(n*100)+'%';const label=r=>(r.nome||'Sem nome')+' | '+r.fornecedor;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function filtered(){let s=supplier.value,p=project.value,q=search.value.toLowerCase();return DATA.filter(r=>(!s||label(r)==s)&&(!p||r.projeto==p)&&(!q||(r.material+' '+r.descricao+' '+label(r)).toLowerCase().includes(q)))}
function groups(rows){let m={};rows.forEach(r=>(m[label(r)]??=[]).push(r));return Object.entries(m).map(([name,a])=>{let v=a.filter(x=>x.ltR>0&&x.ltA>0),qa=a.reduce((s,x)=>s+x.qtdS,0),qe=a.reduce((s,x)=>s+x.qtdE,0),la=v.reduce((s,x)=>s+x.ltA,0)/(v.length||1),lr=v.reduce((s,x)=>s+x.ltR,0)/(v.length||1);return{name,a,la,lr,d:lr-la,vol:qa?qe/qa:0,qa,qe,on:v.filter(x=>x.ltR<=x.ltA).length/(v.length||1)}})}
function options(){let ss=[...new Set(DATA.map(label))].sort(),ps=[...new Set(DATA.map(r=>r.projeto).filter(Boolean))].sort();supplier.innerHTML='<option value="">Todos os fornecedores</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');project.innerHTML='<option value="">Todos os projetos</option>'+ps.map(x=>`<option>${esc(x)}</option>`).join('')}
function tickerCards(rows){let g=groups(rows),v=rows.filter(x=>x.ltR>0),qa=rows.reduce((s,x)=>s+x.qtdS,0),qe=rows.reduce((s,x)=>s+x.qtdE,0),items=[['Fornecedores ativos',g.length,'no recorte atual'],['LT acordado médio',fmt(v.reduce((s,x)=>s+x.ltA,0)/(v.length||1))+' dias','base válida'],['LT realizado médio',fmt(v.reduce((s,x)=>s+x.ltR,0)/(v.length||1))+' dias','base válida'],['Entregas no prazo',pct(v.filter(x=>x.ltR<=x.ltA).length/(v.length||1)),'materiais avaliados'],['Atingimento de volume',pct(qa?qe/qa:0),fmt(qe)+' de '+fmt(qa)+' peças'],['Materiais monitorados',rows.length,'linhas da base']];let h=items.map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('');ticker.innerHTML=h+h}
function bars(gs,key,cls,format){let a=[...gs].sort((x,y)=>y[key]-x[key]).slice(0,10),max=Math.max(1,...a.map(x=>x[key]));return `<div class="chart">${a.map(x=>`<div class="barrow"><div class="name" title="${esc(x.name)}">${esc(x.name)}</div><div class="track"><div class="bar ${cls}" style="width:${Math.max(2,x[key]/max*100)}%"></div></div><div class="val">${format(x[key])}</div></div>`).join('')}</div>`}
function funnel(items,color){let max=Math.max(1,...items.map(x=>x.value));return `<div class="funnel">${items.map((x,i)=>`<div class="funnel-row" style="width:${38+(items.length-i)*5.5}%;background:${color};opacity:${1-i*.055}" title="${esc(x.name)}">${i+1}. ${esc(x.short)} · ${fmt(x.value)}</div>`).join('')}</div>`}
function dashboard(rows){let gs=groups(rows),det=rows.filter(r=>r.ltR>0).map(r=>({name:r.material+' · '+r.descricao,short:r.material,value:Math.abs(r.ltR-r.ltA),supplier:label(r)})).sort((a,b)=>b.value-a.value).slice(0,10),vol=[...gs].sort((a,b)=>b.vol-a.vol).slice(0,10).map(x=>({name:x.name,short:x.name.split('|')[0],value:x.vol*100})),rank=[...gs].sort((a,b)=>(b.on*.55+b.vol*.45)-(a.on*.55+a.vol*.45)).slice(0,3),w=rows.filter(r=>r.qtdS>r.qtdE).map(r=>({...r,gap:r.qtdS-r.qtdE})).sort((a,b)=>b.gap-a.gap).slice(0,10);return `<div class="grid"><div class="stack"><div class="card"><h2>Lead time acordado x realizado por fornecedor</h2><div class="desc">Desvio médio em dias. Valores positivos indicam atraso.</div>${bars(gs,'d','lt',x=>(x>0?'+':'')+fmt(x)+' d')}</div><div class="card"><h2>Top 10 desequilíbrios de lead time</h2><div class="desc">Itens com maior variação absoluta, para cima ou para baixo.</div>${funnel(det,'#c8102e')}</div><div class="card"><h2>Top 10 PNs detratores</h2><div class="desc">Protótipo usando déficit de volume como indicador provisório de detrator. A base de garantias será conectada na aba Qualidade.</div><div class="tablewrap"><table><thead><tr><th>PN</th><th>Descrição</th><th>Fornecedor</th><th>Projeto</th><th class="num">Déficit</th></tr></thead><tbody>${w.map(r=>`<tr><td><b>${esc(r.material)}</b></td><td>${esc(r.descricao)}</td><td>${esc(label(r))}</td><td>${esc(r.projeto)}</td><td class="num"><span class="badge bad">${fmt(r.gap)}</span></td></tr>`).join('')}</tbody></table></div></div></div><div class="stack"><div class="card"><h2>Top 10 fornecedores por entrega de volume</h2><div class="desc">Quantidade entregue no lead time dividida pela quantidade solicitada.</div>${funnel(vol,'#72b936')}</div><div class="card"><h2>Pole position de fornecedores</h2><div class="desc">Score provisório: 55% entregas no prazo + 45% atingimento de volume.</div><div class="podium">${rank[1]?`<div class="pod p2"><b>2</b>${esc(rank[1].name.split('|')[0])}</div>`:''}${rank[0]?`<div class="pod p1"><b>1</b>${esc(rank[0].name.split('|')[0])}</div>`:''}${rank[2]?`<div class="pod p3"><b>3</b>${esc(rank[2].name.split('|')[0])}</div>`:''}</div></div><div class="card"><h2>Saúde da base</h2><div class="desc">Regras aplicadas ao protótipo atual.</div><table><tbody><tr><td>Registros carregados</td><td class="num"><b>${rows.length}</b></td></tr><tr><td>LT Real zerado</td><td class="num"><b>${rows.filter(r=>r.ltR<=0).length}</b></td></tr><tr><td>Projetos</td><td class="num"><b>${new Set(rows.map(r=>r.projeto)).size}</b></td></tr><tr><td>Fonte atual</td><td class="num"><b>Lead time</b></td></tr></tbody></table></div></div></div>`}
function compras(rows){let gs=groups(rows);return `<div class="grid"><div class="card"><h2>Desempenho de prazo por fornecedor</h2><div class="desc">Desvio médio entre lead time realizado e acordado.</div>${bars(gs,'d','lt',x=>(x>0?'+':'')+fmt(x)+' d')}</div><div class="card"><h2>Atendimento de volume</h2><div class="desc">Visão diretamente amarrada ao fornecedor selecionado.</div>${bars(gs,'vol','vol',pct)}</div><div class="card" style="grid-column:1/-1"><h2>Detalhamento de materiais</h2><div class="tablewrap"><table><thead><tr><th>Fornecedor</th><th>Material</th><th>Descrição</th><th class="num">LT acordado</th><th class="num">LT real</th><th class="num">Qtd solicitada</th><th class="num">Qtd entregue</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(label(r))}</td><td><b>${esc(r.material)}</b></td><td>${esc(r.descricao)}</td><td class="num">${fmt(r.ltA)}</td><td class="num">${fmt(r.ltR)}</td><td class="num">${fmt(r.qtdS)}</td><td class="num">${fmt(r.qtdE)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function placeholder(kind){let text={desenvolvimento:'Receberá bases de projetos, fases, cronogramas, amostras, tooling e aprovação por fornecedor.',qualidade:'Receberá bases de garantias, PPM, não conformidades, auditorias e planos de ação por fornecedor.',administrativo:'Receberá cadastros, gestão de usuários, critérios, pesos e parâmetros do HUB.'}[kind];return `<div class="card empty"><b>Módulo ${titles[kind][0]} preparado</b>${text}<br><br>Os filtros, o vínculo por fornecedor e a arquitetura do HUB já estão disponíveis.</div>`}
function render(){let r=filtered();title.textContent=titles[page][0];subtitle.textContent=titles[page][1];tabs.innerHTML=tabMap[page].map((x,i)=>`<div class="tab ${i==0?'active':''}">${x}</div>`).join('');tickerCards(r);content.innerHTML=page==='dashboard'?dashboard(r):page==='compras'?compras(r):placeholder(page);source.textContent='Base atual: Resumo_LTReport.xlsx · Dashboard e score são protótipos de estrutura.'}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;if(b.id==='adminBtn'){adminSubmenu.classList.toggle('open');if(side.classList.contains('closed')){side.classList.remove('closed');main.classList.remove('wide')}}else{adminSubmenu.classList.remove('open')}render()});hamb.onclick=()=>{side.classList.toggle('closed');main.classList.toggle('wide')};[supplier,project,period].forEach(x=>x.onchange=render);search.oninput=render;file.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let wb;if(f.name.endsWith('.csv'))wb=XLSX.read(await f.text(),{type:'string'});else wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let n=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();let get=(o,names)=>o[Object.keys(o).find(k=>names.includes(n(k)))];let num=v=>Number(String(v||0).replace('.','').replace(',','.'))||0;DATA=a.map(o=>({material:String(get(o,['material','codigo material'])||''),descricao:String(get(o,['descricao','descricao material'])||''),fornecedor:String(get(o,['fornecedor','codigo fornecedor'])||''),nome:String(get(o,['desscricao','descricao fornecedor','nome fornecedor'])||''),ltA:num(get(o,['lt acordado','lead time acordado'])),ltR:num(get(o,['lt real','lead time real'])),qtdS:num(get(o,['qtd solicit','qtd solicitada','volume acordado'])),qtdE:num(get(o,['qtd entreg lt','qtd entregue lt','volume real'])),projeto:String(get(o,['projeto'])||'')}));options();render()}catch(err){alert('Não foi possível ler a base: '+err.message)}};function exportData(){if(typeof XLSX==='undefined')return alert('A exportação requer conexão com a biblioteca XLSX.');let ws=XLSX.utils.json_to_sheet(filtered()),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Visao Filtrada');XLSX.writeFile(wb,'Supplier_Hub_Visao_Filtrada.xlsx')}options();render();</script></body></html>
